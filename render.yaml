# Generated by setup.py; contains no credentials.
# Create the garry-ai-remote-0913-login environment group in Render first.
services:
  - type: web
    name: garry-ai-remote-0913-dashboard
    runtime: python
    plan: free
    numInstances: 1
    branch: codex/render-gateway
    buildCommand: bash build.sh
    startCommand: python -m gateway.server
    healthCheckPath: /_gateway/health
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: garry-ai-remote-0913-login
      - key: CONNECTOR_TOKEN
        sync: false
      - key: GATEWAY_ORIGINS
        value: "{\"https://garry-ai-remote-0913-dashboard.onrender.com\": \"dashboard\"}"
      - key: APP_LINKS
