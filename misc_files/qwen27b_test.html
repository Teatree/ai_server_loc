<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halftime Hero — Courtside Hoops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f2e7d5; --orange:#ff7f2a; --gold:#ffc24b; --red:#a5343a;
    --ink:#10151f; --line:#2c3a52; --mut:#8fa0bd;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden; background:var(--ink);
    font-family:'Barlow Condensed',sans-serif; user-select:none; -webkit-user-select:none;}
  canvas{display:block; cursor:crosshair;}
  .hud{position:fixed; inset:0; pointer-events:none; z-index:5;}
  header{display:grid; grid-template-columns:1fr auto 1fr; align-items:start; padding:14px 18px 0;}
  .brand{justify-self:start; display:flex; flex-direction:column; gap:2px;}
  .brand .l1{font-family:Bungee; font-size:19px; color:var(--cream); letter-spacing:.04em; text-shadow:0 2px 0 rgba(0,0,0,.4);}
  .brand .l1 em{font-style:normal; color:var(--orange);}
  .brand .l2{font-size:10px; letter-spacing:.34em; color:#6f80a0; font-weight:600; margin-top:2px;}
  .board{display:flex; gap:22px; align-items:center;
    background:linear-gradient(180deg,#141b2c,#0b0f17);
    border:1px solid var(--line); border-top:3px solid var(--orange);
    padding:10px 24px; box-shadow:0 12px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);}
  .cell{display:flex; align-items:baseline; gap:8px; position:relative;}
  .cell label{font-size:11px; letter-spacing:.25em; color:var(--mut); font-weight:600;}
  .cell b{font-family:Bungee; font-size:25px; color:var(--gold);
    text-shadow:0 0 14px rgba(255,194,75,.45); min-width:2.2ch; text-align:center; font-weight:400;}
  #flame{font-size:16px; position:absolute; right:-15px; top:-15px; opacity:0;
    transform:scale(.4) rotate(-12deg); transition:all .25s cubic-bezier(.2,1.6,.4,1);}
  .board.fire #flame{opacity:1; transform:scale(1) rotate(-8deg); animation:flame .45s infinite alternate;}
  @keyframes flame{to{transform:scale(1.3) rotate(-3deg);}}
  .board.pop{animation:boardPop .5s cubic-bezier(.2,1.6,.4,1);}
  @keyframes boardPop{35%{transform:scale(1.09);}}
  .side{justify-self:end;}
  #mute{pointer-events:auto; width:42px; height:42px; font-size:17px;
    background:#141b29; color:var(--cream); border:1px solid var(--line); cursor:pointer;
    transition:all .15s;}
  #mute:hover{border-color:var(--orange); transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.4);}
  .hint{position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    display:flex; gap:13px; align-items:center; font-size:13px; letter-spacing:.14em;
    color:#8fa0bd; font-weight:600; white-space:nowrap;}
  .hint b{color:var(--cream); background:#151d2e; border:1px solid var(--line);
    padding:2px 9px; font-weight:700; letter-spacing:.06em; font-size:12px;}
  .hint .dot{color:#41506e;}
  #tipoff{position:absolute; top:36%; left:0; right:0; text-align:center;
    font-family:Bungee; font-size:clamp(44px,9vw,96px); color:var(--gold);
    text-shadow:0 6px 0 rgba(0,0,0,.35), 0 0 46px rgba(255,194,75,.35);
    letter-spacing:.06em; opacity:0; animation:tip 2s cubic-bezier(.2,1.4,.4,1) .5s forwards;}
  @keyframes tip{
    0%{opacity:0; transform:scale(.5);}
    18%{opacity:1; transform:scale(1.06);}
    30%{transform:scale(1);}
    72%{opacity:1;}
    100%{opacity:0; transform:scale(1.12) translateY(-16px);}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <header>
    <div class="brand">
      <span class="l1">HALFTIME <em>HERO</em></span>
      <span class="l2">COURTSIDE ARCADE · BASKETBALL</span>
    </div>
    <div class="board" id="board">
      <div class="cell"><label>PTS</label><b id="pts">000</b></div>
      <div class="cell"><label>STREAK</label><b id="stk">×0</b><span id="flame">🔥</span></div>
      <div class="cell"><label>BEST</label><b id="best">000</b></div>
    </div>
    <div class="side"><button id="mute" title="Mute (M)">🔊</button></div>
  </header>
  <div class="hint">
    <span><b>◄ ► / A D</b> MOVE</span><span class="dot">•</span>
    <span><b>R-CLICK + HOLD</b> AIM</span><span class="dot">•</span>
    <span><b>RELEASE</b> SHOOT</span><span class="dot">•</span>
    <span><b>R</b> REBOUND</span><span class="dot">•</span>
    <span><b>M</b> MUTE</span>
  </div>
  <div id="tipoff">TIP-OFF!</div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('game'), cx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
let W=0, H=0, DPR=1;

/* ---------- layout (recomputed on resize) ---------- */
const L = {};
function layout(){
  W = innerWidth; H = innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  cx.setTransform(DPR,0,0,DPR,0,0);
  L.floorY = H - Math.max(84, H*0.11);
  L.ph  = clamp(H*0.155, 96, 150);            // player height
  L.br  = clamp(Math.min(W,H)*0.0165, 11, 17);// ball radius
  L.hoopX = W - clamp(W*0.16, 120, 240);     // left rim end
  L.rimW  = L.br*4.8;
  L.rimY  = L.floorY - L.ph*2.35;
  L.boardX = L.hoopX + L.rimW + 10;
  L.boardW = 13;
  L.boardTop = L.rimY - L.ph*1.02;
  L.boardBot = L.rimY + L.br*0.5;
  L.netLen = L.br*2.4;
  L.g    = Math.max(H*2.15, 1450);
  L.maxV = clamp(Math.sqrt(2.15*H*Math.max(W,700))*1.05, 1000, 2600);
  buildCrowd(); buildDust();
}

/* ---------- state ---------- */
const player = { x:200, vx:0, face:1, phase:0, follow:0, followA:0 };
const ball   = { x:0, y:0, vx:0, vy:0, held:true, rot:0, age:0, rest:0,
                 scored:false, tRim:false, tBoard:false, ret:null };
let score=0, streak=0, best=0;
try{ best = +localStorage.getItem('hh-best') || 0; }catch(e){}
let hype=0, netSway=0, netStretch=0, rimGlow=0, shake=0, slowT=0, timeScale=1, tGlobal=0;
let aiming=false, lastNudge=-9;
const mouse = {x:0, y:0};
const keys  = {left:false, right:false};
let particles=[], popups=[], crowd=[], dust=[];

/* ---------- audio (WebAudio, synth only) ---------- */
let AC=null, muted=false;
function ac(){
  if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); }
  if(AC && AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,f2,type,t,vol,delay=0){
  if(muted) return; const a=ac(); if(!a) return;
  const t0=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2), t0+t);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+t);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+t+0.05);
}
function noise(t,vol,f0,f1,delay=0){
  if(muted) return; const a=ac(); if(!a) return;
  const t0=a.currentTime+delay, n=Math.max(1,Math.floor(a.sampleRate*t));
  const buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=0.8;
  f.frequency.setValueAtTime(f0,t0); f.frequency.exponentialRampToValueAtTime(Math.max(60,f1), t0+t);
  const g=a.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+Math.min(0.08, t*0.3));
  g.gain.exponentialRampToValueAtTime(0.0001, t0+t);
  src.connect(f); f.connect(g); g.connect(a.destination); src.start(t0); src.stop(t0+t);
}
const sBounce = v => { tone(110,42,'triangle',0.12,0.5*v+0.1); noise(0.06,0.12*v,900,300); };
const sRim    = () => tone(680,470,'square',0.14,0.10);
const sBoard  = () => { tone(190,80,'sawtooth',0.10,0.12); noise(0.08,0.10,1200,400); };
const sSwish  = () => noise(0.28,0.28,3200,700);
const sWhoosh = () => noise(0.16,0.10,1800,500);
const sScore  = () => { tone(660,660,'square',0.09,0.08); tone(880,880,'square',0.14,0.08,0.09); };
function sCheer(){
  noise(1.3,0.22,300,900);
  for(let i=0;i<5;i++) tone(500+Math.random()*900, 400+Math.random()*500,'sine',0.12,0.03, 0.15+Math.random()*0.5);
}
function toggleMute(){
  muted=!muted; $('mute').textContent = muted?'🔇':'🔊';
  if(!muted) sScore();
}
$('mute').addEventListener('click', toggleMute);

/* ---------- aim math ---------- */
function aimHand(){
  const h=L.ph, f=player.face;
  const s={x:player.x+f*h*0.10, y:L.floorY-h*0.80};
  let dx=mouse.x-s.x, dy=mouse.y-s.y;
  const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
  return {x:s.x+dx*h*0.34, y:s.y+dy*h*0.34};
}
function aimVel(p){
  const h=L.ph, f=player.face;
  const s={x:player.x+f*h*0.10, y:L.floorY-h*0.80};
  let dx=mouse.x-p.x, dy=mouse.y-p.y;
  const d=Math.hypot(dx,dy)||1;
  const sp=clamp(d*2.1, L.maxV*0.22, L.maxV);
  return {vx:dx/d*sp, vy:dy/d*sp, power:(sp-L.maxV*0.22)/(L.maxV*0.78)};
}
function handPos(){
  if(aiming) return aimHand();
  if(player.follow>0){
    const h=L.ph;
    return {x:player.x+player.face*h*0.10+Math.cos(player.followA)*h*0.42,
            y:L.floorY-h*0.80+Math.sin(player.followA)*h*0.42};
  }
  return {x:player.x+player.face*L.br*1.5, y:L.floorY-L.ph*1.0};
}
function inWindow(x){ return x > L.hoopX+L.br*0.9 && x < L.hoopX+L.rimW-L.br*0.9; }

/* ---------- physics ---------- */
function circleRect(b, rx, ry, rw, rh, rest){
  const nx=clamp(b.x,rx,rx+rw), ny=clamp(b.y,ry,ry+rh);
  let dx=b.x-nx, dy=b.y-ny;
  const d2=dx*dx+dy*dy;
  if(d2 > L.br*L.br) return false;
  let d=Math.sqrt(d2);
  if(d===0){ dx=1; dy=0; d=1; }
  dx/=d; dy/=d;
  b.x=nx+dx*(L.br+0.1); b.y=ny+dy*(L.br+0.1);
  const dot=b.vx*dx+b.vy*dy;
  if(dot<0){ b.vx-=2*dot*dx; b.vy-=2*dot*dy; b.vx*=rest; b.vy*=rest; }
  return true;
}
function hitPin(b, px, py){
  const R=L.br+4.5;
  const dx=b.x-px, dy=b.y-py, d2=dx*dx+dy*dy;
  if(d2>R*R || d2===0) return false;
  const d=Math.sqrt(d2), nx=dx/d, ny=dy/d;
  b.x=px+nx*R; b.y=py+ny*R;
  const dot=b.vx*nx+b.vy*ny;
  if(dot<0){
    b.vx-=2*dot*nx; b.vy-=2*dot*ny;
    b.vx*=0.55; b.vy*=0.55; b.tRim=true;
  }
  return true;
}
function stepBall(b, dt, live){
  b.vy += L.g*dt;
  b.x  += b.vx*dt;
  b.y  += b.vy*dt;
  if(circleRect(b, L.boardX, L.boardTop, L.boardW, L.boardBot-L.boardTop, 0.55) && live){
    sBoard(); shake=Math.max(shake,5); b.tBoard=true;
  }
  if(hitPin(b, L.hoopX, L.rimY) && live) sRim();
  if(hitPin(b, L.hoopX+L.rimW, L.rimY) && live) sRim();
  // net drag once inside the hoop
  if(b.y>L.rimY && b.y<L.rimY+L.netLen && b.x>L.hoopX && b.x<L.hoopX+L.rimW){
    b.vx *= Math.max(0, 1-5*dt);
    b.vy *= Math.max(0, 1-1.4*dt);
    if(live) netStretch=1;
  }
  // floor
  if(b.y + L.br > L.floorY){
    b.y = L.floorY - L.br;
    if(b.vy > 0){
      const imp=b.vy;
      b.vy = -b.vy*0.6; b.vx *= 0.985;
      if(live && imp>140) sBounce(Math.min(1, imp/1200));
      if(Math.abs(b.vy) < 60) b.vy=0;
    }
  }
}

/* ---------- shooting & scoring ---------- */
function shoot(){
  const p=aimHand(), v=aimVel(p);
  ball.held=false;
  ball.x=p.x; ball.y=p.y; ball.vx=v.vx; ball.vy=v.vy;
  ball.age=0; ball.rest=0; ball.scored=false; ball.tRim=false; ball.tBoard=false; ball.ret=null;
  player.follow=0.28;
  player.followA=Math.atan2(v.vy, v.vx);
  sWhoosh();
}
function resetBall(){
  ball.scored=false; ball.tRim=false; ball.tBoard=false;
  ball.age=0; ball.rest=0; ball.vx=0; ball.vy=0; ball.ret=null;
}
function onScore(b){
  const clean = !b.tRim && !b.tBoard;
  streak++;
  const pts = clean ? 2 : 1;
  score += pts;
  best = Math.max(best, score);
  try{ localStorage.setItem('hh-best', best); }catch(e){}
  let word, color='#ffd257', size=34;
  if(streak===3)            { word='ON FIRE!';          color='#ff8a3c'; }
  else if(streak===5)       { word='UNSTOPPABLE!';      size=30; }
  else if(streak>=10)       { word='ABSOLUTE LEGEND!';  size=27; }
  else if(clean)            { word='SWISH!'; }
  else if(b.tBoard)         { word='OFF THE GLASS!';    size=25; color='#fff'; }
  else                      { word='RATTLED IN!';       size=25; color='#fff'; }
  const x=L.hoopX+L.rimW/2;
  popup(word, x, L.rimY-46, color, size);
  popup((clean?'+2':' +1')+' PTS', x, L.rimY-14, '#f2e7d5', 15);
  burst(x, L.rimY+14);
  hype=1; netSway=1.6; netStretch=1; rimGlow=1; slowT=0.5; timeScale=0.3;
  sSwish(); sCheer();
  if(clean) sScore();
  const el=$('board'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  updateHUD();
}
function updateHUD(){
  $('pts').textContent  = String(Math.min(999,score)).padStart(3,'0');
  $('stk').textContent  = '×'+streak;
  $('best').textContent = String(Math.min(999,best)).padStart(3,'0');
  $('board').classList.toggle('fire', streak>=3);
}
function nudgeNoBall(){
  if(tGlobal-lastNudge < 1.5) return;
  lastNudge=tGlobal;
  popup('REBOUND — PRESS R', clamp(player.x,120,W-120), L.floorY-L.ph-22, '#8fa0bd', 15);
}

/* ---------- particles & popups ---------- */
function popup(text,x,y,color,size=30){
  popups.push({text, x:clamp(x,80,W-80), y, vy:-46, life:1.15, max:1.15, color, size});
}
function burst(x,y){
  const cols=['#ff7f2a','#ffd257','#f2e7d5','#a5343a','#58b7b0','#ff5a2e'];
  for(let i=0;i<70;i++){
    const a=Math.random()*Math.PI*2, sp=120+Math.random()*380;
    particles.push({type:'conf', x, y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-180, g:900, drag:1.1,
      rot:Math.random()*6.3, vr:(Math.random()-0.5)*14,
      w:5+Math.random()*6, h:3+Math.random()*4,
      c:cols[i%cols.length], life:1.4+Math.random()*1.1, max:2.5});
  }
}
function puff(x,y){
  for(let i=0;i<10;i++){
    const a=Math.random()*6.3, sp=30+Math.random()*80;
    particles.push({type:'puff', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      g:0, drag:4, r:3+Math.random()*4, life:0.35+Math.random()*0.2, max:0.55});
  }
}

/* ---------- background builders ---------- */
function buildCrowd(){
  crowd=[];
  const pal=['#3a4a63','#4a3b4f','#5a4632','#33554e','#5d3a3a','#44506b','#6b5a3a','#3f4a3f'];
  for(let r=0;r<4;r++){
    const y=H*0.09 + r*(H*0.034), n=Math.ceil(W/26);
    for(let i=0;i<n;i++){
      crowd.push({x:8+i*26+Math.random()*14-7, y:y+Math.random()*6,
        r:5+Math.random()*3, c:pal[(Math.random()*pal.length)|0],
        ph:Math.random()*6.28, arm:Math.random()<0.18});
    }
  }
}
function buildDust(){
  dust=[];
  for(let i=0;i<34;i++)
    dust.push({x:Math.random()*W, y:Math.random()*L.floorY,
      r:0.8+Math.random()*1.8, s:4+Math.random()*10, ph:Math.random()*6.3});
}

/* ---------- update ---------- */
function update(rawDt, dt){
  // player
  const dir=(keys.right?1:0)-(keys.left?1:0);
  if(dir){ player.vx += dir*3800*dt; player.face=dir; }
  else   { player.vx *= Math.max(0,1-14*dt); if(Math.abs(player.vx)<4) player.vx=0; }
  player.vx = clamp(player.vx, -540, 540);
  player.x  = clamp(player.x + player.vx*dt, 18, W-18);   // never leaves the window
  player.phase += Math.abs(player.vx)*dt*0.042;
  if(player.follow>0) player.follow-=rawDt;

  // ball
  if(ball.held){
    const p=handPos();
    ball.x=p.x; ball.y=p.y; ball.rot+=dt*0.5;
  } else if(ball.ret){
    ball.ret.t += rawDt*2.4;
    const t=Math.min(1, ball.ret.t), e=1-Math.pow(1-t,3), p=handPos();
    ball.x = ball.ret.x + (p.x-ball.ret.x)*e;
    ball.y = ball.ret.y + (p.y-ball.ret.y)*e - Math.sin(t*Math.PI)*40;
    ball.rot += rawDt*7;
    if(ball.ret.t>=1){ ball.ret=null; ball.held=true; resetBall(); puff(p.x,p.y); }
  } else {
    ball.age += dt;
    const sub=3, sdt=dt/sub;
    for(let i=0;i<sub;i++){
      const py=ball.y;
      stepBall(ball, sdt, true);
      ball.rot += ball.vx*sdt/L.br;
      if(!ball.scored && ball.vy>0 && py<=L.rimY && ball.y>L.rimY && inWindow(ball.x)){
        ball.scored=true; onScore(ball); break;
      }
    }
    const onFloor = ball.y >= L.floorY-L.br-0.5;
    const spd = Math.hypot(ball.vx, ball.vy);
    if(onFloor && spd<30) ball.rest+=dt; else ball.rest=0;
    if(ball.age>6 || ball.rest>0.75 || ball.x<-60 || ball.x>W+60 || ball.y>H+120){
      if(!ball.scored){
        streak=0;
        popup('NO GOOD', clamp(ball.x,80,W-80), L.floorY-46, '#8fa0bd', 20);
        updateHUD();
      }
      ball.ret={x:ball.x, y:ball.y, t:0};
    }
  }

  // decays
  hype=Math.max(0,hype-rawDt*0.5);
  netSway=Math.max(0,netSway-rawDt*0.7);
  netStretch=Math.max(0,netStretch-rawDt*2.2);
  rimGlow=Math.max(0,rimGlow-rawDt*1.6);
  shake=Math.max(0,shake-rawDt*26);

  // dust
  for(const d of dust){
    d.y+=d.s*dt; d.x+=Math.sin(tGlobal*0.6+d.ph)*8*dt;
    if(d.y>L.floorY){ d.y=-4; d.x=Math.random()*W; }
  }
  // particles
  for(const p of particles){
    p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g||0)*dt;
    if(p.drag){ const f=Math.max(0,1-p.drag*dt); p.vx*=f; p.vy*=f; }
    if(p.vr) p.rot+=p.vr*dt;
  }
  particles=particles.filter(p=>p.life>0);
  // popups
  for(const p of popups){ p.life-=dt; p.y+=p.vy*dt; p.vy*=Math.max(0,1-2.4*dt); }
  popups=popups.filter(p=>p.life>0);
}

/* ---------- drawing ---------- */
function drawWall(){
  const wy=H*0.34;
  let g=cx.createLinearGradient(0,0,0,wy);
  g.addColorStop(0,'#0b101c'); g.addColorStop(1,'#1a2437');
  cx.fillStyle=g; cx.fillRect(0,0,W,wy);
  // crowd
  for(const c of crowd){
    const bob=Math.sin(tGlobal*1.4+c.ph)*(1+hype*7);
    const y=c.y+bob;
    cx.fillStyle=c.c;
    cx.beginPath(); cx.arc(c.x,y,c.r,0,6.3); cx.fill();
    if(c.arm && hype>0.15){
      cx.strokeStyle=c.c; cx.lineWidth=2;
      cx.beginPath();
      cx.moveTo(c.x-2,y); cx.lineTo(c.x-5,y-c.r-7);
      cx.moveTo(c.x+2,y); cx.lineTo(c.x+6,y-c.r-7);
      cx.stroke();
    }
  }
  cx.fillStyle='rgba(140,160,190,0.25)'; cx.fillRect(0,wy,W,3);
  g=cx.createLinearGradient(0,wy,0,L.floorY);
  g.addColorStop(0,'#243049'); g.addColorStop(1,'#1a2334');
  cx.fillStyle=g; cx.fillRect(0,wy,W,L.floorY-wy);
  // giant painted number
  cx.save();
  cx.globalAlpha=0.06; cx.fillStyle='#f2e7d5';
  cx.font=Math.min(220,H*0.24)+'px Bungee, sans-serif';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('23', W*0.30, (wy+L.floorY)/2+10);
  cx.restore();
  // banners
  banner(W*0.13, wy+14, 'CITY CUP · 1998');
  banner(W*0.40, wy+14, 'HARDWOOD HALL');
}
function banner(x,y,text){
  const bw=clamp(W*0.10,90,140), bh=44;
  cx.fillStyle='#7e2f35'; cx.fillRect(x,y,bw,bh);
  cx.strokeStyle='rgba(255,194,75,0.55)'; cx.lineWidth=2;
  cx.strokeRect(x+3,y+3,bw-6,bh-6);
  cx.fillStyle='#f2d9a8'; cx.font='700 12px Barlow Condensed, sans-serif';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(text, x+bw/2, y+bh/2);
}
function drawLights(){
  cx.save();
  cx.globalCompositeOperation='lighter';
  for(const lx of [W*0.26, W*0.68]){
    const g=cx.createRadialGradient(lx,-H*0.1,10, lx,-H*0.1, H*0.9);
    g.addColorStop(0,'rgba(255,214,150,0.10)');
    g.addColorStop(1,'rgba(255,214,150,0)');
    cx.fillStyle=g; cx.fillRect(0,0,W,L.floorY);
  }
  cx.restore();
  for(const d of dust){
    cx.globalAlpha=0.05+0.10*(0.5+0.5*Math.sin(tGlobal*2+d.ph));
    cx.fillStyle='#ffe9c9';
    cx.beginPath(); cx.arc(d.x,d.y,d.r,0,6.3); cx.fill();
  }
  cx.globalAlpha=1;
}
function drawFloor(){
  const y=L.floorY, h=H-y;
  const g=cx.createLinearGradient(0,y,0,H);
  g.addColorStop(0,'#d9a463'); g.addColorStop(0.55,'#c08a4c'); g.addColorStop(1,'#8a5c30');
  cx.fillStyle=g; cx.fillRect(0,y,W,h);
  cx.fillStyle='rgba(255,235,200,0.14)'; cx.fillRect(0,y,W,2);
  cx.strokeStyle='rgba(80,45,15,0.25)'; cx.lineWidth=2;
  for(let x=((W+170)%88); x<W; x+=88){
    cx.beginPath(); cx.moveTo(x,y+2); cx.lineTo(x,H); cx.stroke();
  }
  cx.save();
  cx.globalAlpha=0.12; cx.fillStyle='#f2e7d5';
  cx.font=Math.min(54,h*0.5)+'px Bungee, sans-serif';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('★ 23 ★', W*0.32, y+h*0.55);
  cx.restore();
  cx.fillStyle='rgba(242,231,213,0.5)';
  cx.fillRect(L.boardX+L.boardW+28, y, 4, h);
}
function drawBackboard(){
  cx.fillStyle='#232c3c';
  cx.fillRect(L.boardX+L.boardW+3, L.boardTop+6, 11, L.floorY-L.boardTop-6);
  const g=cx.createLinearGradient(L.boardX,0,L.boardX+L.boardW,0);
  g.addColorStop(0,'#efe8d8'); g.addColorStop(1,'#cfc6b0');
  cx.fillStyle=g;
  cx.fillRect(L.boardX, L.boardTop, L.boardW, L.boardBot-L.boardTop);
  cx.fillStyle='#ff5a2e'; cx.fillRect(L.boardX-2, L.boardTop, 3, L.boardBot-L.boardTop);
  cx.fillStyle='#8b8371'; cx.fillRect(L.boardX, L.boardTop, L.boardW, 5);
  cx.fillStyle='#ff5a2e';
  cx.fillRect(L.hoopX+L.rimW, L.rimY-3, L.boardX-L.hoopX-L.rimW, 6);
}
function roundRect(x,y,w,hh,r){
  cx.beginPath();
  cx.moveTo(x+r,y);
  cx.arcTo(x+w,y,x+w,y+hh,r); cx.arcTo(x+w,y+hh,x,y+hh,r);
  cx.arcTo(x,y+hh,x,y,r);     cx.arcTo(x,y,x+w,y,r);
  cx.closePath();
}
function drawLeg(hx,hy,fx,fy2,h,skin){
  const mx=(hx+fx)/2+4, my=(hy+fy2)/2;
  cx.strokeStyle=skin; cx.lineWidth=h*0.10; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(hx,hy+h*0.05);
  cx.quadraticCurveTo(mx,my,fx,fy2-6); cx.stroke();
  cx.fillStyle='#f2e7d5'; cx.fillRect(fx-7, fy2-8, 15, 8);
  cx.fillStyle='#ff5a2e'; cx.fillRect(fx-7, fy2-3, 15, 3);
}
function drawPlayer(){
  const h=L.ph, f=player.face, x=player.x, fy=L.floorY;
  const sp=clamp(Math.abs(player.vx)/540,0,1);
  const bob=Math.sin(tGlobal*2.2)*1.5*(1-sp);
  const hipY=fy-h*0.46+bob, shY=fy-h*0.78+bob, shX=x+f*h*0.05;
  const skin='#e8a06b', skinD='#c97f4f';
  cx.fillStyle='rgba(20,14,8,0.30)';
  cx.beginPath(); cx.ellipse(x, fy+7, h*0.40, 7, 0, 0, 6.3); cx.fill();

  // far arm
  let fa;
  if(aiming){ const s={x:shX,y:shY}; fa=Math.atan2(mouse.y-s.y, mouse.x-s.x)+0.7; }
  else if(player.follow>0) fa=player.followA+0.8;
  else fa = f>0 ? 2.5 : Math.PI-2.5;
  cx.strokeStyle=skinD; cx.lineWidth=h*0.085; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(shX,shY+h*0.03);
  cx.lineTo(shX+Math.cos(fa)*h*0.30, shY+h*0.03+Math.sin(fa)*h*0.30); cx.stroke();

  // legs
  const swing=Math.sin(player.phase)*h*0.17*sp;
  const lift1=Math.max(0,Math.cos(player.phase))*6*sp;
  const lift2=Math.max(0,-Math.cos(player.phase))*6*sp;
  drawLeg(x, hipY, x+swing, fy-lift1, h, skin);
  drawLeg(x, hipY, x-swing, fy-lift2, h, skinD);

  // shorts
  cx.fillStyle='#a5343a';
  cx.beginPath();
  cx.moveTo(shX-h*0.15, hipY-h*0.02);
  cx.lineTo(shX+h*0.15, hipY-h*0.02);
  cx.lineTo(shX+h*0.19, hipY+h*0.16);
  cx.lineTo(shX-h*0.19, hipY+h*0.16);
  cx.closePath(); cx.fill();
  cx.fillStyle='#f2e7d5'; cx.fillRect(shX-h*0.15, hipY-h*0.03, h*0.30, 3);

  // torso
  cx.fillStyle='#f2e7d5';
  roundRect(shX-h*0.155, shY, h*0.31, hipY-shY+h*0.03, h*0.09); cx.fill();
  cx.fillStyle='#ff7f2a';
  cx.fillRect(shX-h*0.155, shY, 4, hipY-shY+h*0.03);
  cx.fillRect(shX+h*0.155-4, shY, 4, hipY-shY+h*0.03);
  cx.fillStyle='#22304a';
  cx.font=(h*0.17)+'px Bungee, sans-serif';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('23', shX, (shY+hipY)/2+h*0.02);

  // head
  cx.fillStyle=skin; cx.fillRect(shX-3, shY-6, 6, 8);
  const hr=h*0.115, hx=shX+f*hr*0.5, hy=shY-hr-2;
  cx.beginPath(); cx.arc(hx,hy,hr,0,6.3); cx.fill();
  cx.fillStyle='#2b2018';
  cx.beginPath(); cx.arc(hx,hy,hr,Math.PI*1.05,Math.PI*1.95); cx.fill();
  cx.fillStyle='#ff7f2a'; cx.fillRect(hx-hr, hy-hr*0.55, hr*2, hr*0.34);
  cx.fillStyle='#22304a';
  cx.beginPath(); cx.arc(hx+f*hr*0.5, hy-hr*0.05, 1.8, 0, 6.3); cx.fill();

  // near arm — points at aim / follow-through / idle hold
  let target;
  if(aiming) target=aimHand();
  else if(player.follow>0){
    target={x:player.x+player.face*h*0.10+Math.cos(player.followA)*h*0.42,
            y:L.floorY-h*0.80+Math.sin(player.followA)*h*0.42};
  } else target={x:player.x+player.face*L.br*1.5, y:L.floorY-L.ph*1.0};
  cx.strokeStyle=skin; cx.lineWidth=h*0.09;
  cx.beginPath(); cx.moveTo(shX, shY+h*0.03); cx.lineTo(target.x, target.y); cx.stroke();
  cx.fillStyle=skin;
  cx.beginPath(); cx.arc(target.x, target.y, h*0.055, 0, 6.3); cx.fill();
}
function drawBall(){
  const r=L.br;
  const hgt=clamp(1-(L.floorY-(ball.y+r))/(H*0.55), 0, 1);
  cx.fillStyle='rgba(20,14,8,'+(0.28*hgt).toFixed(3)+')';
  cx.beginPath(); cx.ellipse(ball.x, L.floorY+7, r*1.5*hgt+2, 4.5*hgt+1, 0,0,6.3); cx.fill();
  cx.save();
  cx.translate(ball.x,ball.y); cx.rotate(ball.rot);
  const g=cx.createRadialGradient(-r*0.45,-r*0.5,r*0.2, 0,0,r*1.2);
  g.addColorStop(0,'#ffb257'); g.addColorStop(0.55,'#f98a2b'); g.addColorStop(1,'#c85f14');
  cx.fillStyle=g;
  cx.beginPath(); cx.arc(0,0,r,0,6.3); cx.fill();
  cx.strokeStyle='rgba(90,42,8,0.85)'; cx.lineWidth=Math.max(1.5,r*0.12);
  cx.beginPath(); cx.arc(0,0,r,0,6.3); cx.stroke();
  cx.beginPath(); cx.ellipse(0,0,r*0.5,r,0,0,6.3); cx.stroke();
  cx.beginPath(); cx.ellipse(0,0,r,r*0.5,0,0,6.3); cx.stroke();
  cx.restore();
}
function drawRimNet(){
  const x0=L.hoopX, x1=L.hoopX+L.rimW, y0=L.rimY;
  const sway=Math.sin(tGlobal*8)*8*netSway;
  const len=L.netLen*(1+netStretch*0.3);
  const yb=y0+len, cxm=(x0+x1)/2+sway;
  const bw=(x1-x0)*0.20, bx0=cxm-bw, bx1=cxm+bw;
  const N=5;
  cx.strokeStyle='rgba(244,236,218,0.85)'; cx.lineWidth=1.6;
  cx.beginPath();
  for(let i=0;i<=N;i++){
    const t=i/N, tx=x0+(x1-x0)*t;
    for(const j of [-1,1]){
      const t2=clamp(t+j*(1/N),0,1);
      cx.moveTo(tx,y0+2);
      cx.lineTo(bx0+(bx1-bx0)*t2, yb);
    }
  }
  cx.stroke();
  cx.beginPath(); cx.moveTo(bx0,yb); cx.lineTo(bx1,yb); cx.stroke();
  if(rimGlow>0){
    cx.save(); cx.globalAlpha=rimGlow*0.8;
    cx.shadowColor='#ffd257'; cx.shadowBlur=26;
    cx.strokeStyle='#ffd257'; cx.lineWidth=6; cx.lineCap='round';
    cx.beginPath(); cx.moveTo(x0,y0); cx.lineTo(x1,y0); cx.stroke();
    cx.restore();
  }
  cx.strokeStyle='#ff5a2e'; cx.lineWidth=5; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(x0,y0); cx.lineTo(x1,y0); cx.stroke();
  cx.fillStyle='#ff7a45';
  cx.beginPath(); cx.arc(x0,y0,4.6,0,6.3); cx.fill();
}
function drawPreview(){
  if(!aiming || !ball.held) return;
  const p=aimHand(), v=aimVel(p);
  const b={x:p.x, y:p.y, vx:v.vx, vy:v.vy, tRim:false, tBoard:false};
  const sdt=1/90;
  let scored=false, last=null;
  const dots=[];
  for(let i=0;i<180;i++){
    const py=b.y;
    stepBall(b, sdt, false);
    if(b.vy>0 && py<=L.rimY && b.y>L.rimY && inWindow(b.x)) scored=true;
    if(i%2===0){ dots.push([b.x,b.y]); last=[b.x,b.y]; }
    if(scored && b.y>L.rimY+L.netLen) break;
    if(b.y>=L.floorY-L.br && b.vy>0) break;
    if(b.x<-40 || b.x>W+40) break;
  }
  for(let i=0;i<dots.length;i++){
    const k=1-i/dots.length;
    cx.globalAlpha=0.25+0.65*k;
    cx.fillStyle = i%2 ? '#ffd257' : '#f2e7d5';
    cx.beginPath(); cx.arc(dots[i][0], dots[i][1], 1.5+2.6*k, 0, 6.3); cx.fill();
  }
  cx.globalAlpha=1;
  if(last){
    cx.strokeStyle = scored ? '#ffd257' : 'rgba(242,231,213,0.7)';
    cx.lineWidth=2;
    cx.beginPath(); cx.arc(last[0],last[1], scored?9:6, 0,6.3); cx.stroke();
    if(scored){ cx.fillStyle='#ffd257'; cx.beginPath(); cx.arc(last[0],last[1],3.5,0,6.3); cx.fill(); }
  }
  const pw=v.power;
  cx.strokeStyle = pw>0.8 ? '#ff5a2e' : pw>0.5 ? '#ff9c3c' : '#ffd257';
  cx.lineWidth=4;
  cx.beginPath();
  cx.arc(p.x,p.y,L.br+8, -Math.PI/2, -Math.PI/2+pw*Math.PI*1.6);
  cx.stroke();
}
function drawParticles(){
  for(const p of particles){
    const k=clamp(p.life/p.max,0,1);
    if(p.type==='conf'){
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
      cx.globalAlpha=k; cx.fillStyle=p.c;
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      cx.restore(); cx.globalAlpha=1;
    } else {
      cx.globalAlpha=k*0.5; cx.fillStyle='rgba(242,231,213,1)';
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.3); cx.fill(); cx.globalAlpha=1;
    }
  }
}
function drawPopups(){
  cx.lineJoin='round';
  for(const p of popups){
    const age=p.max-p.life;
    const a=clamp(p.life/0.4,0,1);
    const s=0.6+0.4*easeOut(Math.min(1,age/0.18));
    cx.save();
    cx.translate(p.x,p.y); cx.scale(s,s);
    cx.globalAlpha=a;
    cx.font=p.size+'px Bungee, sans-serif';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.lineWidth=6; cx.strokeStyle='rgba(16,20,30,0.85)';
    cx.strokeText(p.text,0,0);
    cx.fillStyle=p.color;
    cx.fillText(p.text,0,0);
    cx.restore(); cx.globalAlpha=1;
  }
}
function drawVignette(){
  const g=cx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.45, W/2,H*0.5,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(8,10,16,0)');
  g.addColorStop(1,'rgba(8,10,16,0.42)');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
}
function render(){
  cx.save();
  if(shake>0.2) cx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawWall();
  drawLights();
  drawFloor();
  drawBackboard();
  drawPlayer();
  drawBall();
  drawRimNet();
  drawPreview();
  drawParticles();
  drawPopups();
  cx.restore();
  drawVignette();
}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  const rawDt=Math.min((now-last)/1000, 0.034); last=now;
  tGlobal+=rawDt;
  if(slowT>0){ slowT-=rawDt; timeScale=0.25+Math.max(0,slowT/0.5)*0.5; }
  else timeScale += (1-timeScale)*Math.min(1, rawDt*5);
  update(rawDt, rawDt*timeScale);
  render();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
addEventListener('keydown', e=>{
  if(e.code==='ArrowLeft'  || e.code==='KeyA'){ keys.left=true;  e.preventDefault(); }
  if(e.code==='ArrowRight' || e.code==='KeyD'){ keys.right=true; e.preventDefault(); }
  if(e.code==='KeyM') toggleMute();
  if(e.code==='KeyR' && !ball.held && !ball.ret) ball.ret={x:ball.x, y:ball.y, t:0};
});
addEventListener('keyup', e=>{
  if(e.code==='ArrowLeft'  || e.code==='KeyA') keys.left=false;
  if(e.code==='ArrowRight' || e.code==='KeyD') keys.right=false;
});
addEventListener('mousemove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
addEventListener('mousedown', e=>{
  if(e.button===2){
    if(ball.held && !ball.ret) aiming=true;
    else nudgeNoBall();
  }
});
addEventListener('mouseup', e=>{
  if(e.button===2 && aiming){ aiming=false; shoot(); }
});
addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('blur', ()=>{ aiming=false; keys.left=keys.right=false; });
addEventListener('resize', layout);

/* ---------- go ---------- */
if(document.fonts && document.fonts.load){
  document.fonts.load('16px Bungee');
  document.fonts.load('700 14px "Barlow Condensed"');
}
layout();
player.x = clamp(W*0.3, 18, W-18);
updateHUD();
setTimeout(()=>{ const el=$('tipoff'); if(el) el.remove(); }, 3000);
requestAnimationFrame(frame);
})();
</script>
</body>
